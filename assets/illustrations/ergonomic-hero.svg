<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
    <defs>
        <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E9F5EE"/>
            <stop offset="100%" stop-color="#FAF7F2"/>
        </linearGradient>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E5E41"/>
            <stop offset="100%" stop-color="#2E845E"/>
        </linearGradient>
    </defs>
    <!-- Organic Background Blobs -->
    <path d="M40 70 C20 120, 60 170, 140 180 C220 190, 290 140, 280 80 C270 20, 200 10, 130 20 C60 30, 60 20, 40 70 Z" fill="url(#blobGrad)" opacity="0.8"/>
    <circle cx="260" cy="45" r="16" fill="#FEF4E0" opacity="0.9"/>
    <circle cx="65" cy="140" r="12" fill="#E9F5EE"/>

    <!-- Desk / Workstation -->
    <rect x="170" y="115" width="95" height="6" rx="2" fill="#C4B8A4"/>
    <line x1="245" y1="121" x2="245" y2="175" stroke="#A49580" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Monitor on stand -->
    <rect x="210" y="70" width="40" height="32" rx="3" fill="#FFFFFF" stroke="#2B2623" stroke-width="2"/>
    <line x1="216" y1="80" x2="236" y2="80" stroke="#1E5E41" stroke-width="2" stroke-linecap="round"/>
    <line x1="216" y1="87" x2="244" y2="87" stroke="#DDD4C4" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="227" y="102" width="6" height="13" fill="#544B44"/>
    <rect x="220" y="113" width="20" height="2" rx="1" fill="#2B2623"/>

    <!-- Ergonomic Chair -->
    <rect x="100" y="125" width="45" height="5" rx="2" fill="#544B44"/>
    <path d="M102 125 L102 80" stroke="#544B44" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="122" y1="130" x2="122" y2="175" stroke="#2B2623" stroke-width="4"/>
    <line x1="105" y1="175" x2="140" y2="175" stroke="#2B2623" stroke-width="3" stroke-linecap="round"/>

    <!-- Student Figure (Perfect Ergonomic Posture) -->
    <!-- Head -->
    <circle cx="128" cy="62" r="12" fill="#FAF7F2" stroke="url(#primaryGrad)" stroke-width="2.5"/>
    <!-- Spine alignment curve -->
    <path d="M128 74 C129 95, 128 110, 126 125" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Thigh (90 deg) -->
    <line x1="126" y1="125" x2="165" y2="125" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Shin (90 deg) -->
    <line x1="165" y1="125" x2="165" y2="172" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Foot flat -->
    <line x1="165" y1="172" x2="182" y2="172" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arm to keyboard -->
    <polyline points="128,88 145,115 185,115" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Sightline (dashed gold) -->
    <line x1="140" y1="62" x2="208" y2="76" stroke="#B47214" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Floor datum line -->
    <line x1="30" y1="175" x2="290" y2="175" stroke="#DDD4C4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
